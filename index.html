<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tally — a calmer to-do list</title>
    <meta
      name="description"
      content="Tally keeps one honest list of what's next — ranked by what's due, protected by a five-second undo, and locked to your account alone."
    />
    <meta name="theme-color" content="#ffffff" />

    <!-- Apple-mode: resolve the theme (and color-scheme) before any content
         can paint so there is no flash, and let System follow the OS live.
         Keep this in sync with src/lib/theme.ts. -->
    <script>
      (() => {
        const STORAGE_KEY = "tally-theme";
        const root = document.documentElement;
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");

        const readPreference = () => {
          try {
            const stored = window.localStorage.getItem(STORAGE_KEY);
            return stored === "light" || stored === "dark" ? stored : "system";
          } catch {
            return "system";
          }
        };

        const resolve = (preference) => {
          if (preference === "light" || preference === "dark") {
            return preference;
          }
          return prefersDark.matches ? "dark" : "light";
        };

        const apply = () => {
          const theme = resolve(readPreference());
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", theme === "dark" ? "#000000" : "#ffffff");
          }
        };

        apply();

        // Follow the OS while the stored preference is System.
        prefersDark.addEventListener("change", () => {
          if (readPreference() === "system") {
            apply();
          }
        });

        // Another tab changed the preference.
        window.addEventListener("storage", (event) => {
          if (event.key === STORAGE_KEY) {
            apply();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
